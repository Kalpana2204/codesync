version: "3.8"

services:
  # MongoDB Database Service
  mongodb:
    image: mongo:7.0
    container_name: codesync-mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: codesync
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - codesync-network

  # CodeSync Backend API & WebSocket Service
  server:
    build:
      context: ./codesync/server
      dockerfile: Dockerfile
    container_name: codesync-server
    restart: always
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongodb:27017/codesync
      CLIENT_URL: http://localhost:3000
      JWT_SECRET: codesync_super_secret_key_2024
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
    networks:
      - codesync-network

  # CodeSync Frontend Web Client Service (Nginx)
  client:
    build:
      context: ./codesync/client
      dockerfile: Dockerfile
    container_name: codesync-client
    restart: always
    depends_on:
      - server
    ports:
      - "3000:80"
    networks:
      - codesync-network

volumes:
  mongo-data:
    driver: local

networks:
  codesync-network:
    driver: bridge
